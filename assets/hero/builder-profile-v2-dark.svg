  <!-- Info lines with dots -->
  <text x="530" y="95" class="terminal label">Name:</text>
  <text x="665" y="95" class="terminal dots">...........</text>
  <text x="850" y="95" class="terminal value">Tianus Sembiring Milala</text>
  
  <text x="530" y="110" class="terminal label">Role:</text>
  <text x="665" y="110" class="terminal dots">...........</text>
  <text x="850" y="110" class="terminal value">Backend Developer</text>
  
  <text x="530" y="125" class="terminal label">Based:</text>
  <text x="665" y="125" class="terminal dots">...........</text>
  <text x="850" y="125" class="terminal value">Jakarta, Indonesia</text>
  
