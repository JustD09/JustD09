.ascii{fill:#FF6B6B;}
.label{fill:#FF6B6B;font-weight:bold;font-size:14px;}
.value{fill:#E0E0E0;}
.gray{fill:#AAAAAA;}
.green{fill:#00FF00;}
@keyframes scanlines {
  0% { transform: translateY(-680px); }
  100% { transform: translateY(680px); }
}
.scan { animation: scanlines 8s linear infinite; mix-blend-mode: multiply; }
</style>
