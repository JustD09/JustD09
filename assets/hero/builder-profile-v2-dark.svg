  <circle cx="65" cy="28" r="6" fill="#ffd700"/>
  <circle cx="90" cy="28" r="6" fill="#00ff00"/>
  
  <!-- Left panel -->
  <rect x="30" y="45" width="460" height="335" fill="#0f0f0f" stroke="#333333" stroke-width="1" rx="4"/>
  
  <!-- Right panel -->
  <rect x="510" y="45" width="660" height="335" fill="#0f0f0f" stroke="#333333" stroke-width="1" rx="4"/>
  
  <!-- Left panel title -->
