  <text x="665" y="260" class="terminal dots">......</text>
  <text x="850" y="260" class="terminal value">Clustering with Laravel</text>
  
  <text x="540" y="275" class="terminal label">Portfolio:</text>
  <text x="665" y="275" class="terminal dots">.....</text>
  <text x="850" y="275" class="terminal value">TypeScript, Svelte, Netlify</text>
  
  <!-- Footer -->
  <text x="600" y="350" class="terminal accent" text-anchor="middle" font-size="10px">FROM CONCEPT TO PRODUCTION</text>
  
  <!-- Footer info -->
  <text x="600" y="380" class="terminal label" text-anchor="middle" font-size="8px">BACKEND ENGINEERING / FULL-STACK / DEVELOPER TOOLS</text>
