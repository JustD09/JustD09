<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <style>
      .terminal { font-family: 'Courier New', 'Monaco', monospace; font-size: 9px; line-height: 1.2; }
      .header-text { font-family: 'Courier New', 'Monaco', monospace; font-size: 12px; font-weight: bold; }
      .label { fill: #ff6b6b; font-weight: bold; }
      .value { fill: #e0e0e0; }
      .accent { fill: #ff8c42; }
      .dots { fill: #666666; letter-spacing: 0.5px; }
    </style>
  </defs>
  
  <rect width="1200" height="400" fill="#1a1a1a"/>
  
  <!-- Outer border -->
  <rect x="15" y="15" width="1170" height="370" fill="none" stroke="#444444" stroke-width="2" rx="8"/>
  
  <!-- Top chrome -->
