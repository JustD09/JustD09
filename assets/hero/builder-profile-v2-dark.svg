    .panel-title-dark { font-family: 'Courier New', Consolas, monospace; font-size: 11px; letter-spacing: 2px; fill: #FF6B6B; opacity: 0.9; }
    .terminal-label-dark { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 0.5px; fill: #AAAAAA; }
    .live-label-dark { font-family: 'Courier New', Consolas, monospace; font-size: 10px; letter-spacing: 1px; fill: #00FF00; }
