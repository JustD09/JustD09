  <text x="60" y="105" class="terminal accent">  ██▀· · ·▀██</text>
  <text x="60" y="115" class="terminal accent">  ██ ● · ● ██</text>
  <text x="60" y="125" class="terminal accent">  ██ ·   · ██</text>
  <text x="60" y="135" class="terminal accent">  ██▄▀███▀▄██</text>
  <text x="60" y="145" class="terminal accent">   ▀██████▀ </text>
  <text x="60" y="155" class="terminal accent">    ▀█████▀ </text>
  <text x="60" y="165" class="terminal accent">   ▀███████▀</text>
  <text x="60" y="175" class="terminal accent">  ██·     ·██</text>
  <text x="60" y="185" class="terminal accent">  ██ ····· ██</text>
  <text x="60" y="195" class="terminal accent">  ███     ███</text>
  <text x="60" y="205" class="terminal accent">  ████   ████</text>
  <text x="60" y="215" class="terminal accent">   ███████ </text>
  
