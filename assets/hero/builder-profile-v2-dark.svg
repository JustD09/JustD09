<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <style>
      .terminal { font-family: 'Courier New', 'Monaco', monospace; font-size: 11px; }
      .header-text { font-family: 'Courier New', 'Monaco', monospace; font-size: 13px; font-weight: bold; }
      .label { fill: #ff6b6b; font-weight: bold; }
      .value { fill: #e0e0e0; }
      .accent { fill: #ff8c42; letter-spacing: 2px; }
      .dots { fill: #666666; letter-spacing: 1px; }
    </style>
  </defs>
  
  <rect width="1200" height="400" fill="#1a1a1a"/>
  
  <!-- Outer border -->
  <rect x="15" y="15" width="1170" height="370" fill="none" stroke="#444444" stroke-width="2" rx="8"/>
  
  <!-- Top chrome -->
  <ellipse cx="40" cy="28" rx="6" ry="6" fill="#ff6b6b"/>
  <ellipse cx="65" cy="28" rx="6" ry="6" fill="#ffd700"/>
  <ellipse cx="90" cy="28" rx="6" ry="6" fill="#00ff00"/>
  
  <!-- Left panel background -->
  <rect x="30" y="45" width="460" height="335" fill="#222222" stroke="#444444" stroke-width="1" rx="4"/>
  
  <!-- Right panel background -->
  <rect x="510" y="45" width="660" height="335" fill="#222222" stroke="#444444" stroke-width="1" rx="4"/>
  
  <!-- Left panel title -->
  <text x="50" y="65" class="header-text label">PORTRAIT / TIANUS</text>
  
  <!-- ASCII Art Portrait -->
  <text x="120" y="110" class="terminal accent">    ██████</text>
  <text x="120" y="128" class="terminal accent">   ██ ● ██</text>
  <text x="120" y="146" class="terminal accent">   ██████</text>
  <text x="120" y="164" class="terminal accent">   ██ ▲ ██</text>
  <text x="120" y="182" class="terminal accent">   ██   ██</text>
  <text x="120" y="200" class="terminal accent">  ███████</text>
  <text x="120" y="218" class="terminal accent">  ██     ██</text>
  <text x="120" y="236" class="terminal accent">  ██     ██</text>
  <text x="120" y="254" class="terminal accent">  ██     ██</text>
  
  <!-- Right panel title -->
  <text x="530" y="65" class="header-text label">PROFILE / BACKEND BUILDER</text>
  
  <!-- Divider line -->
  <line x1="530" y1="75" x2="1150" y2="75" stroke="#444444" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Info Section 1 -->
  <text x="540" y="100" class="terminal header-text" style="fill: #00ff00;">tianus@jakarta</text>
  
  <text x="540" y="125" class="terminal label">Name:</text>
  <text x="730" class="dots">.................</text>
  <text x="900" y="125" class="terminal value">Tianus Sembiring Milala</text>
  
  <text x="540" y="145" class="terminal label">Role:</text>
  <text x="730" class="dots">.................</text>
  <text x="900" y="145" class="terminal value">Backend Developer</text>
  
  <text x="540" y="165" class="terminal label">Based:</text>
  <text x="730" class="dots">................</text>
  <text x="900" y="165" class="terminal value">Jakarta, Indonesia</text>
  
  <text x="540" y="185" class="terminal label">Mode:</text>
  <text x="730" class="dots">.................</text>
  <text x="900" y="185" class="terminal value">Building / Shipping / Scaling</text>
  
  <!-- Build Focus Section -->
  <text x="540" y="215" class="terminal header-text accent">- BUILD.FOCUS</text>
  
  <text x="550" y="235" class="terminal label">Backend:</text>
  <text x="760" class="dots">.........</text>
  <text x="900" y="235" class="terminal value">Laravel, REST APIs, Optimization</text>
  
  <text x="550" y="255" class="terminal label">Full-Stack:</text>
  <text x="760" class="dots">.....</text>
  <text x="900" y="255" class="terminal value">Svelte, Tailwind, Integration</text>
  
  <text x="550" y="275" class="terminal label">Database:</text>
  <text x="760" class="dots">......</text>
  <text x="900" y="275" class="terminal value">MySQL, PostgreSQL, Scaling</text>
  
  <!-- Selected Work Section -->
  <text x="540" y="310" class="terminal header-text accent">- SELECTED.WORK</text>
  
  <text x="550" y="330" class="terminal label">KUBUKU:</text>
  <text x="760" class="dots">......</text>
  <text x="900" y="330" class="terminal value">Android App on Google Play</text>
  
  <text x="550" y="350" class="terminal label">K-Means:</text>
  <text x="760" class="dots">.......</text>
  <text x="900" y="350" class="terminal value">Laravel Clustering Analysis</text>
  
  <!-- Footer -->
  <text x="600" y="385" class="terminal label" text-anchor="middle" font-style="italic">FROM CONCEPT TO PRODUCTION</text>
</svg>